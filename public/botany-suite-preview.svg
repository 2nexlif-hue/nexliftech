    <rect x="0" y="0" width="26" height="26" rx="4" fill="#10b981"/><text x="13" y="17" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">1</text>
    <rect x="32" y="0" width="26" height="26" rx="4" fill="#10b981"/><text x="45" y="17" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">2</text>
