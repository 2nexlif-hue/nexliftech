  </text>

  <!-- Left Main Question Canvas -->
  <rect x="85" y="115" width="440" height="255" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
  
  <rect x="105" y="132" width="70" height="20" rx="4" fill="#7c3aed" fill-opacity="0.2"/>
  <text x="140" y="146" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">
