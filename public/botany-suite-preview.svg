  <text x="120" y="240" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">A. Tobacco Mosaic Virus (TMV)</text>

  <rect x="105" y="256" width="400" height="28" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1.2"/>
  <circle cx="118" cy="270" r="5" fill="#10b981"/>
  <text x="132" y="274" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">B. Cauliflower Mosaic Virus (CaMV) ✓</text>

  <rect x="105" y="290" width="400" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="120" y="308" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">C. Turnip Yellow Mosaic Virus (TYMV)</text>

  <rect x="105" y="324" width="400" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="120" y="342" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">D. Potato Virus X (PVX)</text>

