    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Glow circles -->
  <circle cx="200" cy="180" r="140" fill="#7c3aed" opacity="0.18" filter="blur(60px)"/>
  <circle cx="620" cy="240" r="120" fill="#10b981" opacity="0.15" filter="blur(50px)"/>

  <!-- Mock CBT Window Card -->
  <rect x="60" y="55" width="680" height="340" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

  <!-- Window Header Bar -->
