    <rect x="96" y="0" width="26" height="26" rx="4" fill="#10b981"/><text x="109" y="17" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">4</text>
    <rect x="128" y="0" width="26" height="26" rx="4" fill="#64748b"/><text x="141" y="17" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">5</text>

