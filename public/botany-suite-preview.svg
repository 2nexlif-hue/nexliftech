    <rect x="32" y="32" width="26" height="26" rx="4" fill="#64748b"/><text x="45" y="49" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">7</text>
    <rect x="64" y="32" width="26" height="26" rx="4" fill="#10b981"/><text x="77" y="49" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">8</text>
    <rect x="96" y="32" width="26" height="26" rx="4" fill="#10b981"/><text x="109" y="49" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">9</text>
    <rect x="128" y="32" width="26" height="26" rx="4" fill="#f59e0b"/><text x="141" y="49" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">10</text>

    <!-- Row 3 -->
    <rect x="0" y="64" width="26" height="26" rx="4" fill="#10b981"/><text x="13" y="81" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">11</text>
    <rect x="32" y="64" width="26" height="26" rx="4" fill="#10b981"/><text x="45" y="81" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">12</text>
    <rect x="64" y="64" width="26" height="26" rx="4" fill="#7c3aed"/><text x="77" y="81" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">13</text>
    <rect x="96" y="64" width="26" height="26" rx="4" fill="#0284c7" stroke="#fff" stroke-width="1.5"/><text x="109" y="81" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">14</text>
    <rect x="128" y="64" width="26" height="26" rx="4" fill="#334155"/><text x="141" y="81" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle">15</text>
  </g>

  <!-- Attribution Badge at Bottom -->
  <rect x="550" y="280" width="160" height="74" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="560" y="298" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700">ACADEMIC DIRECTOR</text>
  <text x="560" y="312" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700">Dr. Aubid Hussain Malik</text>
  <text x="560" y="324" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5">Assistant Professor</text>
  <text x="560" y="342" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="600">Deployed by NexLifTech</text>
