<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="leaf-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left: Stylized Leaf / DNA strand -->
  <path d="M 42 85 C 18 70 15 40 38 22 C 45 16 50 12 50 12 C 50 12 48 22 44 32 C 34 55 46 78 42 85 Z" fill="url(#logo-grad)" opacity="0.9" />
  
  <!-- Right: Coding Bracket / DNA complementary strand -->
  <path d="M 45 28 L 68 50 L 45 72" stroke="url(#logo-grad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- DNA / Tech Nodes connecting them -->
  <line x1="30" y1="38" x2="52" y2="38" stroke="#06b6d4" stroke-width="2" stroke-dasharray="2 3" opacity="0.7" />
  <circle cx="30" cy="38" r="2.5" fill="#8b5cf6" />
  <circle cx="52" cy="38" r="2.5" fill="#06b6d4" />

  <line x1="28" y1="50" x2="68" y2="50" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="2 3" opacity="0.8" />
  <circle cx="28" cy="50" r="3" fill="#ec4899" />
  <circle cx="68" cy="50" r="3.5" fill="#06b6d4" filter="url(#glow)" />

  <line x1="32" y1="62" x2="55" y2="62" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="2 3" opacity="0.7" />
  <circle cx="32" cy="62" r="2.5" fill="#8b5cf6" />
  <circle cx="55" cy="62" r="2.5" fill="#6366f1" />
</svg>
