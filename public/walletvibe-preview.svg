<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGlow" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d111d"/>
      <stop offset="0.5" stop-color="#0a0d16"/>
      <stop offset="1" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10b981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accentViolet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1e293b" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="blurGlow" x="-50" y="-50" width="900" height="550" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#bgGlow)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="100" r="180" fill="#10b981" fill-opacity="0.12" filter="url(#blurGlow)"/>
  <circle cx="650" cy="350" r="220" fill="#6366f1" fill-opacity="0.15" filter="url(#blurGlow)"/>

  <!-- App Window Container -->
  <rect x="25" y="25" width="750" height="400" rx="16" fill="#111827" fill-opacity="0.8" stroke="#1f2937" stroke-width="1.5"/>

  <!-- Top App Navigation Header -->
  <rect x="25" y="25" width="750" height="50" rx="16" fill="#1f2937" fill-opacity="0.4"/>
  <line x1="25" y1="75" x2="775" y2="75" stroke="#374151" stroke-width="1"/>

  <!-- Window Dots -->
  <circle cx="50" cy="50" r="5" fill="#ef4444"/>
  <circle cx="66" cy="50" r="5" fill="#f59e0b"/>
  <circle cx="82" cy="50" r="5" fill="#10b981"/>

  <!-- WalletVibe Logo & Name -->
  <rect x="110" y="37" width="26" height="26" rx="6" fill="url(#accentEmerald)"/>
  <path d="M116 45h14v10h-14zM116 48h14" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <text x="145" y="55" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="#ffffff">WalletVibe</text>

  <!-- Nav Links -->
  <text x="320" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#10b981">Overview</text>
  <text x="400" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#9ca3af">Expenditure</text>
  <text x="495" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#9ca3af">Lend / Borrow</text>
  <text x="600" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#9ca3af">Bank Records</text>
  <text x="700" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#9ca3af">Reports</text>

  <!-- Dashboard Grid Layout -->
  
  <!-- KPI Card 1: Total Balance -->
  <rect x="45" y="95" width="225" height="100" rx="12" fill="url(#cardBg)" stroke="#374151" stroke-width="1"/>
  <text x="65" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#9ca3af">Total Net Balance</text>
  <text x="65" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#ffffff">₹ 2,48,500</text>
  <rect x="65" y="165" width="75" height="18" rx="9" fill="#10b981" fill-opacity="0.2"/>
  <text x="73" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#34d399">▲ +14.2% mo</text>

  <!-- KPI Card 2: Expenditure -->
  <rect x="287" y="95" width="225" height="100" rx="12" fill="url(#cardBg)" stroke="#374151" stroke-width="1"/>
  <text x="307" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#9ca3af">Monthly Expenditure</text>
  <text x="307" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#f87171">₹ 42,180</text>
  <text x="307" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280">Budget limit: ₹ 60,000</text>

