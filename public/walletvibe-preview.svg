  <!-- Mon -->
  <rect x="85" y="310" width="18" height="60" rx="4" fill="url(#accentEmerald)"/>
  <rect x="107" y="340" width="18" height="30" rx="4" fill="url(#accentViolet)"/>
  <text x="96" y="388" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#9ca3af">Mon</text>

  <!-- Tue -->
  <rect x="155" y="280" width="18" height="90" rx="4" fill="url(#accentEmerald)"/>
  <rect x="177" y="325" width="18" height="45" rx="4" fill="url(#accentViolet)"/>
  <text x="166" y="388" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#9ca3af">Tue</text>

  <!-- Wed -->
  <rect x="225" y="260" width="18" height="110" rx="4" fill="url(#accentEmerald)"/>
  <rect x="247" y="315" width="18" height="55" rx="4" fill="url(#accentViolet)"/>
  <text x="236" y="388" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#9ca3af">Wed</text>

  <!-- Thu -->
  <rect x="295" y="290" width="18" height="80" rx="4" fill="url(#accentEmerald)"/>
  <rect x="317" y="330" width="18" height="40" rx="4" fill="url(#accentViolet)"/>
  <text x="306" y="388" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#9ca3af">Thu</text>

  <!-- Fri -->
  <rect x="365" y="270" width="18" height="100" rx="4" fill="url(#accentEmerald)"/>
  <rect x="387" y="305" width="18" height="65" rx="4" fill="url(#accentViolet)"/>
  <text x="376" y="388" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#9ca3af">Fri</text>

