  <text x="370" y="242" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#10b981">● Income</text>
  <text x="430" y="242" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6366f1">● Expense</text>

