  <text x="550" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#9ca3af">Lend / Borrow Status</text>
  <text x="550" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#38bdf8">+₹ 15,000</text>
  <text x="550" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#34d399">2 Pending Receivables</text>

