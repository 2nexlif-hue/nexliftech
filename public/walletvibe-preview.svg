  <text x="545" y="242" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Bank &amp; Transaction Activity</text>

  <!-- Txn 1 -->
  <circle cx="560" cy="275" r="12" fill="#10b981" fill-opacity="0.2"/>
  <text x="556" y="279" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#34d399">↓</text>
  <text x="580" y="272" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#e5e7eb">Consulting Credit</text>
  <text x="580" y="284" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#9ca3af">HDFC Bank • Today</text>
  <text x="700" y="276" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#34d399">+₹12,500</text>

  <!-- Txn 2 -->
  <circle cx="560" cy="315" r="12" fill="#ef4444" fill-opacity="0.2"/>
  <text x="556" y="319" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#f87171">↑</text>
  <text x="580" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#e5e7eb">Cloud Server Hosting</text>
  <text x="580" y="324" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#9ca3af">SBI Bank • Yesterday</text>
  <text x="705" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#f87171">-₹1,850</text>

  <!-- Txn 3 -->
  <circle cx="560" cy="355" r="12" fill="#3b82f6" fill-opacity="0.2"/>
  <text x="556" y="359" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#60a5fa">⇄</text>
  <text x="580" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#e5e7eb">Lend Settlement</text>
  <text x="580" y="364" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#9ca3af">Rahul M. • 2 days ago</text>
  <text x="702" y="356" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#60a5fa">+₹5,000</text>
</svg>
