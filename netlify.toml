[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://checkout.razorpay.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; media-src 'self' https://cdn.pixabay.com; connect-src 'self' https://*.googleapis.com https://*.firebaseapp.com https://*.firebaseio.com wss://*.firebaseio.com https://api.netlify.com https://*.google-analytics.com https://api.razorpay.com https://lumberjack.razorpay.com; frame-src 'self' https://*.firebaseapp.com https://api.razorpay.com https://checkout.razorpay.com; object-src 'none'; base-uri 'self';"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

# 1. Permanent 301 Redirect for Google Search Console Change of Address
[[redirects]]
  from = "https://nexliftech.netlify.app/*"
  to = "https://nexliftech.space/:splat"
  status = 301
  force = true

# 2. Single Page App rewrite rule
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build]
  publish = "dist"
  command = "npm run build"
